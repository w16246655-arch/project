<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فيديوهات لغة الإشارة</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
        }

        /* القسم الأزرق العلوي */
        .hero-section {
            background-color: #1a4f8b;
            color: white;
            text-align: center;
            padding: 40px 20px 60px 20px;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
        }

            .hero-section h1 {
                font-size: 38px;
                margin: 0 0 10px 0;
            }

            .hero-section p {
                font-size: 18px;
                margin: 0;
                opacity: 0.9;
            }

        /* حاوية القائمة */
        .menu-container {
            max-width: 600px;
            margin: -30px auto 0 auto;
            padding: 0 20px;
        }

        /* تصميم الأزرار أو الخانات */
        .menu-list {
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.06);
            overflow: hidden;
        }

        .menu-item {
            padding: 18px 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #1a4f8b;
            border-bottom: 1px solid #eaeaea;
            transition: background-color 0.2s ease, transform 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

            .menu-item:last-child {
                border-bottom: none;
            }

            .menu-item:hover {
                background-color: #f7f9fc;
                color: #0d3b66;
            }

        /* قسم الملاحظة */
        .note-section {
            text-align: center;
            margin-top: 40px;
            padding: 0 20px;
            color: #333;
        }

            .note-section h3 {
                font-size: 22px;
                margin-bottom: 8px;
                color: #222;
            }

            .note-section p {
                font-size: 16px;
                color: #666;
                margin: 0;
            }

        /* التجاوب مع الهواتف والشاشات الصغيرة */
        @media (max-width: 768px) {
            .hero-section h1 {
                font-size: 28px;
            }

            .menu-container {
                margin-top: -20px;
            }

            .menu-item {
                font-size: 18px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    

    <!-- القسم الأزرق -->
    <div class="hero-section">
        <h1>فيديوهات لغة الإشارة</h1>
        <p>خطوة جديدة في رحلة التعلم والابتكار)</p>
    </div>

    <!-- قائمة الخيارات (حروف، أرقام، طوارئ، كلمات عامة، ألوان) -->
    <div class="menu-container">
        <div class="menu-list">
            <a href="https://youtu.be/mxHICfk1Hj0?si=_L6Jy7sUrTO4bMXZ" class="menu-item">حروف</a>
            <a href="https://youtu.be/eMwHlyq-pRE?si=yISUmxyU_hCoAqLP" class="menu-item">أرقام</a>
            <a href="https://youtu.be/fm5EGSKmUfQ?si=vur3zPcMrHZfbNOL" class="menu-item">كلمات طوارئ</a>
            <a href="https://youtu.be/VqHCq6E6jRg?si=GXQTMxhAqizsD9Xd" class="menu-item">كلمات عامة</a>
            <a href="https://youtu.be/wV6swODx3uI?si=8-hHgsbSM846lANa" class="menu-item">ألوان</a>
        </div>
    </div>

    <!-- الملاحظة -->
    <div class="note-section">
        <h3>ملاحظة:</h3>
        <p>فيديوهات عشوائية </p>
    </div>

</body>
</html>
