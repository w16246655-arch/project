<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>عرض الصورة</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }

        .single-image-card {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 30px;
            display: inline-block;
            max-width: 600px;
        }

            .single-image-card img {
                width: 100%;
                height: auto;
                border-radius: 10px;
            }

            .single-image-card h2 {
                margin-top: 20px;
                color: #333;
            }
        /* تنسيق زر الرجوع */
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

            .back-btn:hover {
                background-color: #45a049;
            }
    </style>
</head>
<body>

    <div class="single-image-card">
        <!-- استبدلي "اسم_الصورة.jpg" باسم الصورة الخاصة بكِ -->
        <img src="1793792418292.jpg" alt="صورة توضيحية">
        <h2>الطوارئ</h2>

        <!-- زر الرجوع للصفحة الرئيسية -->
        <a href="صور.html" class="back-btn">الرجوع للرئيسية</a>
    </div>

</body>
</html>
